# Data source configuration for mixed pretraining.
# Qwen2.5-Coder validated ratio: 70% code, 20% text, 10% math.
#
# Weights are applied as sample-count proportions by scripts/collect_data.py
# (each source contributes weight * total samples to the combined dataset).

sources:
  code:
    dataset: "bigcode/starcoderdata"
    weight: 0.7
    enabled: true
    languages:
      - typescript
      - javascript
      - python

  text:
    dataset: "HuggingFaceFW/fineweb-edu"
    weight: 0.2
    enabled: true
    min_length: 100
    max_length: 50000

  math:
    dataset: "open-web-math/open-web-math"
    weight: 0.1
    enabled: true
    min_length: 50
    max_length: 30000

# Defaults for the interactive GitHub scraper (scripts/scrape_github.py).
github:
  min_stars: 50
