# Data quality scoring configuration.
# Used by: scripts/score_data.py and the "Score & Filter" menu.

scoring:
  # Security settings for running tools on untrusted code
  security:
    mode: "native"              # off | native | docker
    require_docker: true       # if true + docker unavailable → refuse to score
    timeout: 10                 # seconds per scoring operation
    memory_mb: 512              # Docker memory limit
    docker_image: "node:20-alpine"
    # Image for executing model-generated Python (GRPO python_exec reward,
    # HumanEval) when mode is "docker". Native mode uses the project venv.
    python_docker_image: "python:3.12-alpine"
    audit_log: "logs/scoring_audit.jsonl"
    credential_scan:
      mode: "strip"             # off | warn | strip | reject
    docker:
      pids_limit: 64
      cap_drop: ["ALL"]
      network: "none"
      read_only: true
      tmpfs_size_mb: 64
    # SECURITY: all scraped/streamed content is untrusted. These defaults are
    # the SAFE settings — keep them on. Disabling enabled/in_stream is allowed
    # but logs a loud SECURITY warning at collection time (never silent).
    malware_scan:
      enabled: true              # Master switch. false = NO malware scanning.
      in_stream: true            # Scan streamed record CONTENT during collection
                                 # (before tokenization — .npy output can't be
                                 # pattern-scanned). Clones are always scanned.
      # on_threat applies to the post-download/clone directory scan:
      #   quarantine (default, SAFE) = move threatening files aside, continue
      #   abort                      = stop collection on any threat
      #   warn                       = prompt to continue; in non-interactive
      #                                runs this fails CLOSED (aborts) rather
      #                                than silently ingesting malware.
      # (The in-stream scanner always DROPS threatening records regardless.)
      on_threat: "quarantine"          # warn | quarantine | abort
      scanners:
        defender: true           # Windows Defender (auto-detected)
        yara: true               # Custom YARA rules (always available)
        clamav: false            # ClamAV daemon (opt-in)
      yara_rules_dir: null       # null = use embedded rules

  # Sandbox settings for running tsc/eslint on untrusted code (legacy, see security: above)
  sandbox:
    use_docker: true    # Set true for maximum isolation (requires Docker)
    timeout: 10          # Seconds per scoring operation
    memory_mb: 512       # Docker memory limit

  # Which scorers to enable and their composite weights
  scorers:
    tsc:
      enabled: true
      weight: 0.3
      strict: true
      timeout: 10

    eslint:
      enabled: true
      weight: 0.2
      timeout: 15

    stars:
      enabled: true
      weight: 0.15
      default_score: 0.3   # Fallback when no star data available

    heuristic:
      enabled: true
      weight: 0.2

    classifier:
      enabled: false       # Enable after training with train_judge_classifier.py
      weight: 0.15
      model_dir: "models/quality_classifier"

    injection_safety:      # DATA-063: down-weight prompt-injection payloads (soft)
      enabled: false       # opt-in; pairs with the InjectionFilter (hard-drop)
      weight: 0.1

    educational_value:     # FineWeb-Edu/Stack-Edu cheap static proxy (no LLM)
      enabled: false       # opt-in; pure-Python, CPU-only, deterministic
      weight: 0.1

  # Score-to-training-weight tier mapping
  tier_weights:
    excellent: 2.0    # score >= 0.8
    good: 1.5         # score >= 0.6
    average: 1.0      # score >= 0.4
    poor: 0.3         # score >= 0.2
    reject: 0.0       # score < 0.2

# LLM-as-Judge settings (for annotation phase)
llm_judge:
  provider: "ollama"              # "claude" or "ollama"
  model: "codellama"              # Model name for scoring
  base_url: "http://localhost:11434"  # Ollama API base URL
  num_samples: 10000              # Number of samples to annotate
  output_path: "data/annotations.jsonl"
  # For Claude: set ANTHROPIC_API_KEY environment variable

# Curriculum ordering settings
curriculum:
  enabled: false
  strategy: "easy_to_hard"    # easy_to_hard, hard_to_easy, staged
  num_phases: 3               # For staged strategy

